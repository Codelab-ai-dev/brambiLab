# BrambiLab web v1 runtime: web (SSR), api (Go), postgres (web-v1.md §14).
# Local use: cp .env.example .env && docker compose up --build, then open http://localhost:8000
# The proxy service is the only public entry; secrets live in Coolify.
name: brambilab

# Bounded container logs (json-file rotation). The API never logs bodies, tokens or contact data.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No published port: PostgreSQL is only reachable from the internal network.

  # Release task: applies migrations once, under an advisory lock, before the API starts.
  migrate:
    build: ./api
    logging: *logging
    command: ["migrate"]
    restart: "no"
    environment: &pg-client
      # Standard libpq variables, read verbatim by pgx: no URL is built, so the password
      # may contain URI-reserved characters without escaping.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build: ./api
    logging: *logging
    restart: unless-stopped
    environment:
      <<: *pg-client
      API_PORT: "8080"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
      # Owner login stays disabled (auth endpoints answer 503) until these are set.
      ADMIN_GITHUB_USER_ID: ${ADMIN_GITHUB_USER_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Contact form (WEB-007): disabled unless CONTACT_ENABLED=true and the three values are set.
      CONTACT_ENABLED: ${CONTACT_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
      # Optional; empty means the code default (web-v1.md §13.1, §12.1, §11, §15.1).
      CONTACT_RATE_PER_CLIENT: ${CONTACT_RATE_PER_CLIENT:-}
      CONTACT_RATE_GLOBAL: ${CONTACT_RATE_GLOBAL:-}
      CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-}
      # Docker network of Coolify's proxy and Caddy, e.g. 10.0.1.0/24. Empty trusts every private range.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SESSION_TTL: ${SESSION_TTL:-}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-}
      MEDIA_MAX_RESOURCE_BYTES: ${MEDIA_MAX_RESOURCE_BYTES:-}
      MEDIA_FREE_RESERVE_BYTES: ${MEDIA_FREE_RESERVE_BYTES:-}
      # "off" only in isolated restores: publications, contact and cleanups never run.
      BACKGROUND_JOBS: ${BACKGROUND_JOBS:-}
    volumes:
      - media_data:/data/media
    # Graceful shutdown: HTTP drains up to 15 s; workers stop between passes.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No published port: only the proxy and the web SSR reach the API.
    networks: [internal, public]

  web:
    build: ./web
    logging: *logging
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
      # Canonical, hreflang, Open Graph and sitemap URLs (never the request Host). Required in production.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    networks: [public]

  # Single public entry: /api/v1/* and /media/* go to api, the rest to web (proxy/Caddyfile).
  # In Coolify, attach the domain to this service only.
  proxy:
    build: ./proxy
    logging: *logging
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PUBLIC_HOST_PORT:-8000}:8000"
    networks: [public]

volumes:
  postgres_data:
  media_data:

networks:
  internal:
    internal: true
  public:
