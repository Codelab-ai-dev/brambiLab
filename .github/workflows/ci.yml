name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/api/go.mod
          cache-dependency-path: platform/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./cmd/server

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @redocly/cli@2.54.3 lint platform/contracts/openapi.yaml

  compose:
    runs-on: ubuntu-latest
    needs: [web, api]
    defaults:
      run:
        working-directory: platform
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - name: Smoke test through the proxy
        run: |
          curl -fsS localhost:8000/api/v1/health/ready
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/es | grep -q '<html lang="es"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 302
      - name: Only the proxy (and the test-only fake GitHub) publish ports
        run: |
          published=$(docker compose ps --format '{{.Service}} {{.Ports}}' | grep -E '[0-9]+->' | cut -d' ' -f1 | sort | tr '\n' ' ')
          test "$published" = "fakegithub proxy " || { echo "published: $published"; exit 1; }
      - name: Owner login e2e (fake GitHub)
        run: ./e2e/auth.sh
      - name: Secrets never reach logs
        run: |
          grep -q "POSTGRES_PASSWORD='change-me@local/#1'" .env
          for secret in 'change-me@local' 'e2e-secret' 'access_token' 'csrf_token' 'bl_session='; do
            if docker compose logs 2>&1 | grep -qF "$secret"; then
              echo "found in logs: $secret"; exit 1
            fi
          done
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
